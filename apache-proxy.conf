# Apache Proxy Configuration for accounts.akbgroups.com (Port 3020)
# HTTP Path:  /etc/apache2/conf.d/userdata/std/2_4/accountsakbgroup/accounts.akbgroups.com/proxy.conf
# HTTPS Path: /etc/apache2/conf.d/userdata/ssl/2_4/accountsakbgroup/accounts.akbgroups.com/proxy.conf

<IfModule mod_proxy.c>
    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:3020/
    ProxyPassReverse / http://127.0.0.1:3020/
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"
</IfModule>
